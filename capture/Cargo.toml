[package]
name = "capture"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
common = { path = "../common" }
tokio = { version = "1.28.0", features = ["full"] }
bincode = "1.3.3"
rusqlite = { version = "0.29.0", features = ["bundled"] }
lazy_static = "1.4.0"
chrono = "0.4.26"
zstd = "0.12"
uuid = { version = "1.4", features = ["v4", "serde"] }
byteorder = "1.4"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
prost = "0.14.3"

[features]
default = []
